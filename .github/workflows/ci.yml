name: CI · Test & Verify

# Trigger manually from the Actions tab (switch back to push/pull_request once GitHub Actions billing is active)
on:
  workflow_dispatch:

jobs:
  test:
    name: Node 24 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JavaScript files
        run: npm run check

      - name: Run full SQL Studio & MySQL 9.7 test suite
        run: npm test

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t ekoni-sql-studio:ci .
